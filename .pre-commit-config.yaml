# pre-commit install              # 安装 pre-commit hook
# pre-commit install --hook-type pre-push   # 安装 pre-push hook

# Hooks without an explicit `stages` would otherwise run at every stage (pre-commit
# 4.x default), which would repeat the default-mode pytest on each push.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: protect-main-branch
        name: protect main branch (no direct commits)
        entry: bash -c 'branch=$(git rev-parse --abbrev-ref HEAD); if [ "$branch" = "main" ] || [ "$branch" = "master" ]; then echo "❌ 禁止直接在 $branch 分支上提交，请使用 feature 分支并通过 PR 合并"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true

      - id: protect-main-push
        name: protect main branch (no direct push)
        entry: bash -c 'branch=$(git rev-parse --abbrev-ref HEAD); if [ "$branch" = "main" ] || [ "$branch" = "master" ]; then echo "❌ 禁止直接 push 到 $branch 分支"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: ruff-format
        name: ruff format (code formatting)
        entry: uv run ruff format
        language: system
        pass_filenames: true
        types: [python]

      - id: ruff-check
        name: ruff check --fix (linting with auto-fix)
        entry: uv run ruff check --fix
        language: system
        pass_filenames: true
        types: [python]

      - id: pyright
        name: pyright (type checking)
        entry: uv run pyright
        language: system
        pass_filenames: false
        always_run: true

      # - id: import-linter
      #   name: import-linter (api module encapsulation)
      #   entry: uv run lint-imports
      #   language: system
      #   pass_filenames: false
      #   always_run: true

      - id: pytest-regression
        name: pytest regression + unit tests
        entry: uv run --extra dev python -m pytest tests/regression/ tests/unittest/ tests/numba/test_Feautrier_jit.py -q
        language: system
        pass_filenames: false
        always_run: true

      - id: check-changelogs-size
        name: changelog file size guard (<=300 lines)
        entry: uv run python scripts/check_changelogs_size.py
        language: system
        pass_filenames: false
        always_run: true

      # Fresh NUMBA_CACHE_DIR: numba's cache=True keys on the caller's source file only,
      # so a changed callee in another file can be masked by a stale cache entry.
      - id: pytest-jit
        name: pytest regression + unit tests (SPECTRA_JIT=1, fresh numba cache)
        entry: bash -c 'cache=$(mktemp -d) || exit 1; trap "rm -rf \"$cache\"" EXIT; SPECTRA_JIT=1 NUMBA_CACHE_DIR="$cache" uv run --extra dev python -m pytest tests/regression/ tests/unittest/ tests/numba/test_Feautrier_jit.py -q -p no:cacheprovider'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
