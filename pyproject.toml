[project]
name = "spectra"
version = "0.1.0"
description = "Spectroscopy and radiative transfer computation library"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "numba",
    "scipy",
    "matplotlib",
    "sympy",
    "debtcollector",
    "mpmath",
    "ipykernel",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pre-commit",
]
notebook = [
    "jupyterlab",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectra"]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]
line-length = 120

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "RUF",  # ruff
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C901", # mccabe complexity
    "ISC",  # flake8-implicit-str-concat
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
]
extend-ignore = [
    "SIM103",  # return bool directly — explicit if-else is clearer in this codebase
    "SIM108",  # ternary operator — if-else blocks are clearer for physics expressions
    "SIM118",  # use `key in dict` — project uses explicit `.keys()` calls
    "PIE808",  # unnecessary range start — `range(0, n)` is explicit and clear
    "B007",  # loop variable not used — variable may be used after loop body
]
ignore = [
    # Naming conventions — project uses non-PEP8 naming throughout:
    #   PascalCase modules/dirs, trailing-underscore functions/constants,
    #   PascalCase local variables for physics quantities, T_ type aliases, E_ enums
    "N801",  # class name should use CapWords — project uses Underscore_PascalCase (Radiative_Line)
    "N802",  # function name should be lowercase — project uses trailing underscore (init_Atom_)
    "N803",  # argument name should be lowercase — project uses PascalCase physics args (Te, Ne, Aji)
    "N806",  # variable in function should be lowercase — project uses PascalCase physics vars (Level, Line)
    "N812",  # lowercase imported as non-lowercase — project aliases modules as PascalCase
    "N815",  # mixedCase variable in class scope — physics quantity naming (nLevel, nLine)
    "N816",  # mixedCase variable in global scope — physics constants (eV2erg_)
    "N999",  # invalid module name — project uses PascalCase module names (BasicP.py)
    "E501",  # line too long — long math formulas in docstrings can't use noqa
    "E741",  # ambiguous variable name (l, I) — common in physics notation
    "F403",  # wildcard import — project uses star imports from ImportAll
    "F405",  # undefined name from star import — consequence of F403
    "F811",  # redefinition of unused name — false positive on @OVERLOAD patterns
    "N814",  # camelCase imported as constant — project aliases modules as camelCase
    "TID252",  # relative imports — standard practice for intra-package imports
    "PT009",  # pytest style — project uses unittest, not pytest assertions
]



[tool.ruff.lint.isort]
known-first-party = ["spectra"]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
reportPossiblyUnboundVariable = false
reportOperatorIssue = false
